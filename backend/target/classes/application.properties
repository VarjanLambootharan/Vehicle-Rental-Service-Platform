spring.config.import=optional:file:backend/.env[.properties],optional:file:.env[.properties]
spring.application.name=vehicle-rental
server.port=${SERVER_PORT:8080}
app.storage.path=${APP_STORAGE_PATH:../data/runtime}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}
app.token.secret=${TOKEN_SECRET:${JWT_SECRET:}}
app.token.expiration=${TOKEN_EXPIRATION:${JWT_EXPIRATION:3600}}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
app.business.timezone=${APP_BUSINESS_TIMEZONE:Asia/Colombo}
app.payment.mock-success=${MOCK_PAYMENT_SUCCESS:true}
app.recovery.delay-ms=30000
server.error.include-message=never
server.error.include-stacktrace=never
